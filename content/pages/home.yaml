title: Vincent Cottalorda — Développeur
sections:
  - type: statement
    data:
      name: Vincent Cottalorda
      role: :highlight[Ingénieur en solutions]
      description: "Concepteur de problèmes, Créateur de solutions. De l'émergence de l'idée à la fabrication de l'objet, jusqu'à la pérennisation du système. Un problème a toujours une solution."
      availability: Disponible · à distance ou Ardèche-Drôme
      actions:
        - label: Voir les réalisations
          href: "#index"
        - label: Me contacter
          href: "#contact"
  - type: thesis
    data:
      since: "2008"
      produced: "Pas une reconversion : une pratique continue, menée en parallèle d'autres métiers qui ont payé le loyer et qui ont construit l'autre moitié de ce que je sais faire."
      moments:
        - moment: design
          costAbsence: Un système doit répondre à un besoin. Un besoin à des problèmatiques et chaque problématique doit être pensée, analysée, poussée, arbitrée. Lorsque vous avez éliminé l'impossible, ce qui reste, si improbable soit-il, est nécessairement la vérité
        - moment: build
          costAbsence: La construction doit suivre la logique de conception. Puis itérer par phase. De versions en versions, le système répond au besoin qui lui à été soumis. Il évolue avec lui et ses utilisateurs. Il est maintenable, documenté, testable et testée. Il est lisible et compréhensible par tous.
        - moment: operate
          costAbsence: ⟨à écrire⟩ ce qui casse quand personne ne tient l'exploitation
      clause: Je ne prétends pas être spécialiste de chacune de ces disciplines.
  - type: index
    data:
      title: Trois pièces, trois états.
      entries:
