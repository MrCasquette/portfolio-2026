          proves: Un système doit répondre à un besoin. Un besoin à des problèmatiques et chaque problématique doit être pensée, analysée, poussée, arbitrée. Lorsque vous avez éliminé l'impossible, ce qui reste, si improbable soit-il, est nécessairement la vérité.
        - project: plume
          proves: La construction doit suivre la logique de conception. Puis itérer par phase. De versions en versions, le système répond au besoin qui lui à été soumis. Il évolue avec lui et ses utilisateurs. Il est maintenable, documenté, testable et testée. Il est lisible et compréhensible par tous.
        - project: serveur
          proves: Qu'on sait l'exploiter dans la durée, incidents compris.
